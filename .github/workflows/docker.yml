name: Image Docker (copies auto-hébergées)

# Construit l'image des copies Docker à chaque changement de l'addon sur main :
# ghcr.io/xnzx07/nuvio-assets:latest et :<VERSION> (lue dans worker/index.js). Les nouvelles notes IMDb,
# enregistrées par le bot (dont les push ne déclenchent rien), la relancent depuis imdb.yml.
# Une seule fois après la première image : la rendre publique (Packages → nuvio-assets → Package settings).
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "data/imdb-ratings.bin"
      - "data/sagas.json"
      - "catalogs.json"
      - "wrangler.toml"
      - "Dockerfile"
      - "docker/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: docker
  cancel-in-progress: true

jobs:
  image:
    # Pas sur les forks : chaque copie Cloudflare se met à jour par « Sync fork », pas par une image.
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: v
        run: echo "version=$(grep -oP 'const VERSION = "\K[0-9.]+' worker/index.js)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/xnzx07/nuvio-assets:latest
            ghcr.io/xnzx07/nuvio-assets:${{ steps.v.outputs.version }}
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
