name: Générer les images des collections

on:
  push:
    branches: [main]
    paths:
      - "scripts/make_assets.py"
      - "scripts/tuiles.py"
      - "assets.json"
      - "data/sagas.json"
      - "data/studios.json"
      - "fonts/**"
      - ".github/workflows/assets.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  build:
    # Pas sur les forks : ils lisent les images de ce dépôt, et un commit de leur part bloquerait « Sync fork ».
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 120   # sagas et studios : animations (GIF et vidéo) et vidéos de fond en 1080p
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # main tel qu'il est au départ, pas le commit qui a lancé : une génération en attente derrière une autre
        # repart de ses images au lieu de buter dessus en les enregistrant.
        with:
          ref: main
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Version fixe : une autre version de Pillow change les octets de toutes les images, réécrites à chaque fois.
      - run: pip install pillow==13.0.0
      # gifski (animations des sagas) : archive officielle, empreinte vérifiée.
      - name: Installer gifski
        run: |
          curl -sSfL -o gifski.tar.xz https://github.com/ImageOptim/gifski/releases/download/1.34.0/gifski-1.34.0.tar.xz
          echo "b9b6591aa163123d737353d9c8581efdf3234d28eeaa45329b31da905cd5a996  gifski.tar.xz" | sha256sum -c -
          tar -xJf gifski.tar.xz -C "$RUNNER_TEMP" linux/gifski
          chmod +x "$RUNNER_TEMP/linux/gifski"
          echo "GIFSKI=$RUNNER_TEMP/linux/gifski" >> "$GITHUB_ENV"
          rm gifski.tar.xz
      # ffmpeg (vidéos de fond des sagas) : présent sur les machines GitHub, installé sinon.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: python scripts/make_assets.py
      - name: Enregistrer les images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A genres seasons moods sagas studios gifs logos titles
          git diff --cached --quiet || git commit -m "Met à jour les images des collections"
          # Un autre workflow a pu pousser entre-temps : trois essais.
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || { echo "Envoi refusé (essai $essai sur 3), nouvel essai." >&2; sleep $((essai * 15)); }
          done
          exit 1
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
