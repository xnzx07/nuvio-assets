name: Palmarès (chaque mois)

# Oscar, Palme d'or et César du meilleur film : data/recompenses.json (scripts/build_recompenses.py).
# Chaque 1er du mois : le César (fin février) entre le 1er mars, l'Oscar (mars) le 1er avril, la Palme (fin mai)
# le 1er juin. Les autres mois, rien ne change ou presque (notes TMDB) : un commit seulement si le fichier change.
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_recompenses.py"
  schedule:
    - cron: "40 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  palmares:
    # Pas sur les forks : ils récupèrent le palmarès par « Sync fork ».
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Construire le palmarès
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_recompenses.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recompenses.json
          git diff --cached --quiet && exit 0
          git commit -m "Palmarès du $(date +%F)"
          # Un autre workflow a pu pousser entre-temps : trois essais.
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || { echo "Envoi refusé (essai $essai sur 3), nouvel essai." >&2; sleep $((essai * 15)); }
          done
          exit 1
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
