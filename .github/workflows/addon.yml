name: Mettre à jour l'addon (chaque nuit)

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_addon.py"
      - "scripts/build_search_words.py"
      - "scripts/build_fenetres_vod.py"
      - "catalogs.json"
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 5 h (heure de Paris en été)
  workflow_dispatch:
    inputs:
      season:
        description: "Forcer une saison (halloween, noel, saint-valentin, paques, ete, a-laffiche) — vide = selon la date"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  update:
    # Pas sur les forks : ils lisent les données de ce dépôt, et un commit de leur part bloquerait « Sync fork ».
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Version fixe : une autre version de Pillow change les octets de toutes les images, réécrites à chaque fois.
      - run: pip install pillow==13.0.0
      - name: Construire l'addon
        id: addon
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Passée par une variable et vérifiée : une saison est un mot connu, jamais une commande.
          SEASON: ${{ github.event.inputs.season }}
        run: |
          case "$SEASON" in
            ""|halloween|noel|saint-valentin|paques|ete|a-laffiche) ;;
            *) echo "Saison inconnue : $SEASON" >&2; exit 1 ;;
          esac
          # 0 : tout est à jour. 3 : quelques listes en échec, gardées telles quelles ; le reste est enregistré
          # et le workflow finit en rouge. Autre (panne de TMDB, clé refusée) : rien n'est modifié ni enregistré.
          code=0
          python scripts/update_addon.py $SEASON || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]
      - name: Vocabulaire de la recherche (fautes de frappe)
        id: words
        # En échec, l'ancien vocabulaire reste : l'addon de la nuit est enregistré quand même (bilan en rouge).
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_search_words.py
      - name: Fenêtres salle → numérique des distributeurs (dates « Dispo vers le »)
        id: vod
        # En échec (TMDB ou Wikidata en panne, apprentissage trop maigre), le fichier de la veille reste : l'addon et
        # les affiches continuent de l'utiliser (bilan en rouge).
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_fenetres_vod.py
      - name: Vieux films sans VF (« SANS VF » sur les affiches)
        id: sansvf
        # En échec, ce qui a été lu est gardé et la liste de la veille reste valable (bilan en rouge).
        continue-on-error: true
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_sans_vf.py
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addon seasons gifs titles data
          git diff --cached --quiet || git commit -m "Addon du $(date +%F) — saison : $(python -c 'import json;print(json.load(open("addon/state.json"))["label"])')"
          # Un autre workflow a pu pousser entre-temps : trois essais.
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || { echo "Envoi refusé (essai $essai sur 3), nouvel essai." >&2; sleep $((essai * 15)); }
          done
          exit 1
      - name: Bilan
        if: steps.addon.outputs.code == '3' || steps.words.outcome == 'failure' || steps.vod.outcome == 'failure' || steps.sansvf.outcome == 'failure'
        env:
          CODE: ${{ steps.addon.outputs.code }}
          MOTS: ${{ steps.words.outcome }}
          VOD: ${{ steps.vod.outcome }}
          SANSVF: ${{ steps.sansvf.outcome }}
        run: |
          [ "$CODE" != 3 ] || echo "::error::Des listes ont échoué : elles gardent leurs pages de la veille (voir addon/state.json)."
          [ "$MOTS" != failure ] || echo "::error::Vocabulaire de la recherche non refait : l'ancien reste."
          [ "$VOD" != failure ] || echo "::error::Fenêtres des distributeurs non refaites : data/estimations-vod.json de la veille reste."
          [ "$SANSVF" != failure ] || echo "::error::Films sans VF : panne, le reste attendra demain."
          exit 1
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
