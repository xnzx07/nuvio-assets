name: Notes IMDb (chaque jour)

on:
  push:
    branches: [main]
    paths:
      - "scripts/build_imdb_ratings.py"
  schedule:
    # Chaque soir, largement avant le passage des affiches (4 h 17 UTC) : GitHub peut lancer une tâche planifiée
    # plusieurs heures en retard, et un push sur main redémarre le serveur des affiches.
    - cron: "30 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write   # relancer l'image Docker (voir la dernière étape)

concurrency:
  group: assets
  cancel-in-progress: false

jobs:
  ratings:
    # Pas sur les forks : ils récupèrent les notes par « Sync fork », et un commit de leur part le bloquerait.
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Construire les notes
        run: python scripts/build_imdb_ratings.py
      - name: Enregistrer
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/imdb-ratings.bin
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Notes IMDb du $(date +%F)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Un autre workflow a pu pousser entre-temps : trois essais.
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || { echo "Envoi refusé (essai $essai sur 3), nouvel essai." >&2; sleep $((essai * 15)); }
          done
          exit 1
      # Un push fait avec GITHUB_TOKEN ne déclenche pas d'autre workflow : sans cette étape, l'image Docker
      # garderait les notes de sa dernière construction. Le lancement à la main, lui, est permis.
      - name: Refaire l'image Docker avec les nouvelles notes
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Une fois par semaine (le lundi) : l'image Docker n'a pas besoin de se refaire chaque jour.
        run: |
          [ "$(date +%u)" = 1 ] || exit 0
          gh workflow run docker.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Une seule issue ouverte par workflow : les échecs suivants s'y ajoutent en commentaire.
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
