name: Épisodes de remplissage des anime

# data/fillers.json (scripts/build_fillers.py) : 60 séries d'animefillerlist.com par nuit, une page toutes les
# 10 secondes comme le demande leur robots.txt ; un tour complet en moins d'une semaine.
on:
  push:
    branches: [main]
    paths:
      - "scripts/build_fillers.py"
  schedule:
    - cron: "11 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fillers
  cancel-in-progress: false

jobs:
  fillers:
    # Pas sur les forks : ils récupèrent le fichier par « Sync fork ».
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pillow : scripts/update_addon.py (le client TMDB commun) l'importe.
      - run: pip install pillow==13.0.0 "scrapling[fetchers]==0.5.1"
      - name: Lire les séries
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/build_fillers.py
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fillers.json
          git diff --cached --quiet && exit 0
          git commit -m "Épisodes de remplissage du $(date +%F)"
          for essai in 1 2 3; do
            git pull --rebase && git push && exit 0
            git rebase --abort 2>/dev/null || true
            [ "$essai" = 3 ] || sleep $((essai * 15))
          done
          exit 1
      - name: Signaler l'échec
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TITRE: "Échec de « ${{ github.workflow }} »"
          LIEN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title \
                  --jq '.[] | select(.title == env.TITRE) | .number' | head -n 1)
          if [ -n "$num" ]; then
            gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "Nouvel échec : $LIEN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITRE" --body "Le workflow a échoué : $LIEN"
          fi
