name: Surveillance du serveur Oracle

# Le serveur Oracle sert les catalogues et les fiches (worker/construire/redirections.mjs). S'il ne répond plus, l'addon
# est redéployé sans les redirections, et catalogues et fiches repassent par le Worker ; ce passage finit en rouge pour
# prévenir. Quand il répond de nouveau, elles sont remises. Lancé par le Worker dès qu'il y a quelque chose à faire
# (worker/surveillance.js, toutes les 5 minutes : les tâches planifiées de GitHub prennent des heures de retard) ; le
# planning d'ici ne sert que de secours.
# Le déploiement de main par Cloudflare (Workers Builds) ne les remet que si le serveur répond (worker/construire/statiques.mjs).
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      forcer:
        description: "Exercice : couper ou retablir tout de suite, sans regarder le serveur"
        default: ""

permissions:
  contents: read

concurrency:
  group: surveillance
  cancel-in-progress: false

env:
  CLOUDFLARE_ACCOUNT_ID: 1d2569d3fe4c915bab43a6ec1bda89da

jobs:
  surveiller:
    if: github.repository == 'xnzx07/nuvio-assets'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Le dépôt pèse 2 Go : seulement ce qu'il faut pour décider et déployer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            scripts
            worker
            data
            logo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Décider
        id: decision
        env:
          FORCER: ${{ inputs.forcer }}
        run: |
          case "$FORCER" in
            couper|retablir) echo "action=$FORCER" >> "$GITHUB_OUTPUT"; echo "exercice : $FORCER" ;;
            *) node scripts/surveiller-oracle.mjs ;;
          esac
      - name: Couper (catalogues et fiches sur le Worker)
        if: steps.decision.outputs.action == 'couper'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ADDON_ORACLE: coupe
        run: npx --yes wrangler@4.156.0 deploy
      - name: Rétablir (catalogues et fiches sur le serveur)
        if: steps.decision.outputs.action == 'retablir'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.156.0 deploy
      - name: Prévenir
        if: steps.decision.outputs.action == 'couper'
        run: |
          echo "::error::Serveur Oracle injoignable : catalogues et fiches repassés sur le Worker (comptés dans les 100 000 requêtes par jour)."
          exit 1
