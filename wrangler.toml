# Addon « Catalogue FR » en direct, sur Cloudflare Workers.
# Déployé automatiquement par Cloudflare à chaque modification du dépôt (Workers Builds).
# Secret à définir dans le tableau de bord Cloudflare : TMDB_API_KEY
# Facultatif : GEMINI_API_KEY (clé de l'instance pour /debug ; chaque utilisateur met la sienne dans la salle 2)
# et GEMINI_PUBLIC = "on" pour que la clé de l'instance serve aussi aux liens sans clé (voir worker/ai.js)
# et RELAIS_KEY, la même valeur que la variable RELAIS_KEY du service d'affiches (Vercel) quand elle y est définie :
# l'addon l'envoie à /vf.json pour faire lire la VF des sources d'une liste pas encore dans le cache du service.
# Copies auto-hébergées (voir README) : ADMIN_PASSWORD (espace hébergeur, 10 caractères au moins), DEPOT
# (« pseudo/nuvio-assets ») et, conseillé, HOTE_SECRET (une longue suite de caractères au hasard).
name = "nuvio-assets"
main = "worker/index.js"
compatibility_date = "2026-10-01"
# Les appels de l'addon passent par Internet comme ceux de n'importe qui : sans cette option, Cloudflare refuse (404)
# qu'un Worker en appelle un autre du même compte par son adresse workers.dev (les affiches statiques, « affiches »).
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Les fichiers du site (/statique/…, /logo.png) en fichiers statiques : Cloudflare les sert sans lancer le Worker, hors
# des 100 000 requêtes par jour du compte (gratuit). Écrits avant chaque déploiement et chaque wrangler dev par
# worker/construire/statiques.mjs ; un fichier absent passe par le Worker, comme avant.
[build]
command = "node worker/construire/statiques.mjs"
watch_dir = "worker"

[assets]
directory = ".statique-site"
# Garde les variables ajoutées dans le tableau de bord (copies : DEPOT, GEMINI_PUBLIC) à chaque déploiement.
keep_vars = true

# Notes IMDb (data/imdb-ratings.bin, voir worker/ratings.js) et polices du site (worker/polices/*.woff2, voir
# worker/polices.js) : fichiers binaires intégrés à l'addon.
[[rules]]
type = "Data"
globs = ["**/*.bin", "**/*.woff2"]
fallthrough = true

# L'addon peut s'appeler lui-même (préparation des « pour qui » d'une rangée, voir prefetchProfiles) :
# l'appel a son propre budget de 50 appels sortants.
[[services]]
binding = "SELF"
service = "nuvio-assets"

# Liens fixes (voir worker/fixe.js) : base D1 créée toute seule au premier déploiement, sans identifiant
# à recopier (chaque copie a la sienne). Sans elle, le site ne propose que les liens habituels.
[[d1_databases]]
binding = "LIENS"
database_name = "nuvio-liens"

# Réserve des affiches maison déjà dessinées (voir worker/reserve.js) : une base à part, créée toute seule elle
# aussi. Une base gratuite tient 500 Mo : les liens fixes ne partagent pas la leur avec des images.
# En Europe de l'Ouest, près du service d'affiches (Paris) : la première, « nuvio-reserve », s'était créée en
# Asie-Pacifique (190 ms par lecture). Créée avec `npx wrangler d1 create nuvio-reserve-weur --location=weur`.
[[d1_databases]]
binding = "RESERVE"
database_name = "nuvio-reserve-weur"

# Photo du jour des tendances (worker/tendances.js) : prise à 4 h UTC, la même pour tout le monde. Toutes les 5 minutes :
# le réveil de la surveillance du serveur Oracle (worker/surveillance.js), qui ne fait rien sans son jeton.
[triggers]
crons = ["0 4 * * *", "*/5 * * * *"]

[observability]
enabled = true
# Pas de journal de chaque requête : les adresses contiennent les réglages des liens, parfois une clé
# Gemini. Les messages du code (console.warn…) restent.
[observability.logs]
invocation_logs = false

# Liens fixes (voir worker/fixe.js) : 5 créations par minute au plus depuis une même adresse IP. Facultatif :
# sans cette liaison, pas de limite. namespace_id est un nombre choisi librement, propre à chaque compte
# Cloudflare (rien à créer dans le tableau de bord) ; period vaut 10 ou 60 secondes.
[[ratelimits]]
name = "LIMITE_LIENS"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Guide, le mot de passe de la séance (voir worker/seance.js) : 10 codes notés par minute au plus depuis une même
# adresse IP (une recherche « séance 4821 » en note un par rangée de recherche). Facultatif, comme LIMITE_LIENS.
[[ratelimits]]
name = "LIMITE_SEANCE"
namespace_id = "1201"
simple = { limit = 10, period = 60 }

# Guide, le diagnostic par photo (voir worker/diagnostic.js) : 4 photos par minute au plus depuis une même adresse
# IP (chaque photo coûte un appel à Gemini, parfois avec la clé de l'instance). Facultatif, comme LIMITE_LIENS.
[[ratelimits]]
name = "LIMITE_DIAGNOSTIC"
namespace_id = "1202"
simple = { limit = 4, period = 60 }
# Galerie des styles d'affiches (voir worker/galerie.js) : 3 publications et 3 imports comptés par minute au plus
# depuis une même adresse IP. Facultatif, comme LIMITE_LIENS : sans cette liaison, pas de limite.
[[ratelimits]]
name = "LIMITE_GALERIE"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
